[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ai-agent-tui"
version = "0.1.0"
description = "A provider-agnostic AI agent terminal interface"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.68.0",
  "python-dotenv>=1.0.1",
  "textual>=2.1.2",
]

[project.scripts]
ai-agent = "ai_agent.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_agent"]

[tool.ruff]
target-version = "py311"
line-length = 88
